<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1020">
<meta name="color-scheme" content="light">
<title>CyrCoin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#7A1020; --red-soft:#F6E9EB;
  --indigo:#2E2A7A; --indigo-soft:#ECEBF7;
  --bg:#EEF0F3; --card:#FFFFFF; --line:#D6D9DF; --grey:#5B5F6B; --ink:#000000;
  --good:#1E7A46; --mid:#B7791F; --bad:#C8372D; --empty:#D6D9DF;
  --r:10px;
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; color:var(--ink);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-variant-numeric:tabular-nums;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
a{color:var(--indigo)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{font-weight:800;font-stretch:120%;font-size:28px;letter-spacing:-.5px;color:var(--red);margin:0}
.top .meta{font-size:12px;color:var(--grey);text-align:right}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.indigo{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:0;background:none;padding:6px;font-size:20px;line-height:1}

/* Bandeau marché */
.market{background:var(--indigo);color:#fff;border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
.market .k{font-size:12px;opacity:.85}
.market .v{font-weight:700;font-size:17px}
.market .s{font-size:12px;opacity:.9}
@media(min-width:560px){.market{grid-template-columns:repeat(4,1fr)}}

h2{font-size:19px;font-weight:800;font-stretch:110%;color:var(--red);margin:22px 0 10px}
h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--grey);font-size:13px}
.panel{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.pad{padding:14px}

/* Liste des cryptos */
.coin{display:grid;grid-template-columns:36px 1fr auto;gap:4px 12px;align-items:center;padding:14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.coin:last-child{border-bottom:0}
.coin img{width:36px;height:36px;border-radius:50%;grid-row:span 2}
.coin .name{font-weight:700}
.coin .sym{color:var(--grey);font-size:13px;margin-left:4px;font-weight:500}
.coin .price{font-weight:700;text-align:right}
.coin .chg{font-size:13px;text-align:right}
.coin .segs{grid-column:2 / 4}
.coin .row2{font-size:13px;color:var(--grey)}
.up{color:var(--good)} .down{color:var(--bad)}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px}

/* Barre checklist 12 segments : l'élément signature */
.segs{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:6px}
.seg{height:7px;background:var(--empty);border-radius:2px;overflow:hidden;position:relative}
.seg i{position:absolute;left:0;top:0;bottom:0;display:block}
.segs.big{gap:5px}
.segs.big .seg{height:30px;border-radius:4px}
.segs.big .seg b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink);mix-blend-mode:normal}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--grey);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* Ajout */
.add{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.chip{border:1px dashed var(--red);color:var(--red);background:var(--red-soft);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.results{padding:0 14px 14px}
.res{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.res img{width:24px;height:24px;border-radius:50%}
.res span{flex:1}

/* Détail */
.dhead{display:flex;align-items:center;gap:10px;padding:12px 0}
.dhead img{width:40px;height:40px;border-radius:50%}
.dhead .t{flex:1}
.dhead .n{font-weight:800;font-size:22px;font-stretch:110%;color:var(--red);line-height:1.1}
.dhead .p{font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:4px 0 14px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--grey);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--red);border-bottom-color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid div{background:var(--card);padding:10px 12px}
.grid .k{font-size:12px;color:var(--grey)}
.grid .v{font-weight:700}
.grid .src{font-size:11px;color:var(--grey)}
.spark{width:100%;height:110px;display:block}
.note-box{border-left:4px solid var(--indigo);background:var(--indigo-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.warn-box{border-left:4px solid var(--red);background:var(--red-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}

details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .num{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#fff;background:var(--indigo);font-size:13px;flex:none}
details.sec>summary .cnt{margin-left:auto;font-weight:500;font-size:13px;color:var(--grey)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.crit{padding:12px 14px;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit .l{font-weight:600}
.crit .auto{margin-top:3px;font-size:14px}
.crit .auto small{color:var(--grey)}
.crit .help{font-size:13px}
.rate{display:flex;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
.rate button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.rate button[aria-pressed=true][data-r="1"]{background:var(--good);border-color:var(--good);color:#fff}
.rate button[aria-pressed=true][data-r="0"]{background:var(--mid);border-color:var(--mid);color:#fff}
.rate button[aria-pressed=true][data-r="-1"]{background:var(--bad);border-color:var(--bad);color:#fff}
.note,textarea,.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:14px}
textarea{min-height:72px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}

/* Puces triangles rouge foncé */
ul.tri{list-style:none;padding:0;margin:0}
ul.tri li{position:relative;padding:8px 0 8px 20px;border-bottom:1px solid var(--line)}
ul.tri li:last-child{border-bottom:0}
ul.tri li::before{content:"";position:absolute;left:2px;top:14px;border-left:8px solid var(--red);border-top:5px solid transparent;border-bottom:5px solid transparent}
ul.tri li b{display:block}

.alert{padding:12px 14px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:700;color:var(--red)}
.alert.info .t{color:var(--indigo)}

table.j{width:100%;border-collapse:collapse;font-size:14px}
table.j th,table.j td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.j th{font-size:12px;color:var(--grey);font-weight:600}
.scroll{overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
pre.prompt{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;max-height:280px;overflow:auto;font-family:inherit}

/* Navigation basse */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.bottom button{border:0;background:none;padding:12px 4px;font-weight:700;color:var(--grey);border-top:3px solid transparent}
nav.bottom button[aria-current=page]{color:var(--red);border-top-color:var(--red)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.status{font-size:13px;margin-top:8px}
.status li{color:var(--grey)}
.foot{font-size:12px;color:var(--grey);margin:24px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bottom" aria-label="Navigation principale"><div class="wrap">
  <button data-act="view" data-v="list">Suivi</button>
  <button data-act="view" data-v="news">Actualités</button>
  <button data-act="view" data-v="settings">Réglages</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= Paramètres ================= */
const LS_KEY = "cyrcoin.v1", CACHE_KEY = "cyrcoin.cache.v1", MAX_COINS = 5;
const DEFAULT_TH = { drawdown: 80, fdvRatio: 2, supplyPct: 50, volMc: 1, spread: 0.5, volat: 120, move7d: 25, funding: 0.05, lsRatio: 2.5 };
const TH_DEF = [
  ["drawdown", "Baisse depuis le plus haut historique supérieure à", "%"],
  ["fdvRatio", "FDV / market cap supérieur à", "×"],
  ["supplyPct", "Offre en circulation inférieure à (% de l'offre max)", "%"],
  ["volMc", "Volume 24 h / market cap inférieur à", "%"],
  ["spread", "Spread médian supérieur à", "%"],
  ["volat", "Volatilité annualisée (30 j) supérieure à", "%"],
  ["move7d", "Variation sur 7 jours supérieure à (en valeur absolue)", "%"],
  ["funding", "Funding rate supérieur à (en valeur absolue, par période)", "%"],
  ["lsRatio", "Ratio long/short supérieur à (ou inférieur à son inverse)", "×"]
];
const SUGGEST = [["vechain", "VeChain (VET)"], ["sui", "Sui (SUI)"], ["ripple", "XRP (XRP)"]];
const TTL = { mk: 5*60e3, gl: 10*60e3, fng: 60*60e3, dt: 60*60e3, ch: 60*60e3, chains: 6*3600e3, fees: 6*3600e3, dv: 5*60e3 };

/* ================= État ================= */
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
let S = load(LS_KEY) || {};
S = Object.assign({ coins: [], checks: {}, synth: {}, journal: {}, th: {}, cur: "eur", cgKey: "" }, S);
S.th = Object.assign({}, DEFAULT_TH, S.th);
let C = load(CACHE_KEY) || {};
const ERR = {};
const UI = { view: "list", coin: null, tab: "data", open: new Set(), results: null, searching: false, loading: false, pending: false };
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast("Enregistrement impossible sur cet appareil"); } }
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(C)); }catch(e){ C = {}; } }

/* ================= Outils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nf = o => new Intl.NumberFormat("fr-FR", o);
const isNum = v => typeof v === "number" && isFinite(v);
function money(v, compact){
  if(!isNum(v)) return "—";
  const a = Math.abs(v), o = { style: "currency", currency: S.cur.toUpperCase() };
  if(compact && a >= 1e6){ o.notation = "compact"; o.maximumFractionDigits = 2; }
  else if(a < 1){ o.minimumFractionDigits = 4; o.maximumFractionDigits = 6; }
  else if(a < 100){ o.maximumFractionDigits = 4; }
  else o.maximumFractionDigits = 2;
  return nf(o).format(v);
}
const usd = v => isNum(v) ? nf({ notation: "compact", maximumFractionDigits: 2 }).format(v) + " USDT" : "—";
const num = v => isNum(v) ? nf({ notation: "compact", maximumFractionDigits: 2 }).format(v) : "—";
const pct = (v, d = 1) => isNum(v) ? (v > 0 ? "+" : "") + nf({ minimumFractionDigits: d, maximumFractionDigits: d }).format(v) + " %" : "—";
const cls = v => isNum(v) ? (v >= 0 ? "up" : "down") : "";
const ago = t => { if(!t) return "jamais"; const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : `il y a ${Math.round(m/60)} h`; };
const today = () => new Date().toLocaleDateString("fr-FR");
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }

/* ================= Accès aux données ================= */
async function fetchJSON(url){
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(url, { signal: ctl.signal });
    if(r.status === 429) throw new Error("limite de requêtes atteinte, réessaie dans une minute");
    if(!r.ok) throw new Error("réponse " + r.status);
    return await r.json();
  }catch(e){
    if(e.name === "AbortError") throw new Error("délai dépassé");
    if(e instanceof TypeError) throw new Error("source injoignable depuis le navigateur");
    throw e;
  }finally{ clearTimeout(to); }
}
let cgChain = Promise.resolve();
function cg(path){
  const sep = path.includes("?") ? "&" : "?";
  const url = "https://api.coingecko.com/api/v3" + path + (S.cgKey ? sep + "x_cg_demo_api_key=" + encodeURIComponent(S.cgKey) : "");
  const p = cgChain.then(() => sleep(S.cgKey ? 400 : 2200)).then(() => fetchJSON(url));
  cgChain = p.catch(() => {});
  return p;
}
async function cached(key, ttl, fn, force){
  const e = C[key];
  if(e && !force && Date.now() - e.t < ttl) return e.d;
  try{
    const d = await fn(); C[key] = { t: Date.now(), d }; delete ERR[key]; saveCache(); return d;
  }catch(err){
    ERR[key] = err.message;
    if(e) return e.d;
    return null;
  }
}
const ids = () => S.coins.map(c => c.id);
const kMk = () => `mk:${S.cur}:${["bitcoin", ...ids()].join(",")}`;
const getMarkets = f => cached(kMk(), TTL.mk, () => cg(`/coins/markets?vs_currency=${S.cur}&ids=${["bitcoin", ...ids()].join(",")}&price_change_percentage=24h,7d,30d,1y`), f);
const getGlobal = f => cached("gl", TTL.gl, async () => (await cg("/global")).data, f);
const getFng = f => cached("fng", TTL.fng, async () => (await fetchJSON("https://api.alternative.me/fng/?limit=1")).data[0], f);
const getChains = f => cached("chains", TTL.chains, async () => (await fetchJSON("https://api.llama.fi/v2/chains")).map(c => ({ name: c.name, gecko_id: c.gecko_id, tvl: c.tvl })), f);
const getDetail = (id, f) => cached("dt:" + id, TTL.dt, async () => trimDetail(await cg(`/coins/${id}?localization=false&tickers=true&market_data=false&community_data=true&developer_data=true&sparkline=false`)), f);
const getChart = (id, f) => cached(`ch:${S.cur}:${id}`, TTL.ch, async () => trimChart(await cg(`/coins/${id}/market_chart?vs_currency=${S.cur}&days=90&interval=daily`)), f);
const getFees = (chain, f) => cached("fees:" + chain, TTL.fees, async () => {
  const r = await fetchJSON(`https://api.llama.fi/overview/fees/${encodeURIComponent(chain)}?excludeTotalDataChart=true&excludeTotalDataChartBreakdown=true`);
  return { d24: r.total24h ?? null, d30: r.total30d ?? null };
}, f);
const derivSym = c => (c.deriv || (c.symbol.toUpperCase() + "USDT")).toUpperCase();
const getDeriv = (c, f) => cached("dv:" + derivSym(c), TTL.dv, () => fetchDeriv(derivSym(c)), f);

function trimDetail(d){
  const tk = d.tickers || [];
  const sp = tk.filter(t => isNum(t.bid_ask_spread_percentage) && ["USDT","USD","EUR","USDC"].includes(t.target))
    .sort((a, b) => (b.converted_volume?.usd || 0) - (a.converted_volume?.usd || 0)).slice(0, 10)
    .map(t => t.bid_ask_spread_percentage).sort((a, b) => a - b);
  return {
    cat: d.categories || [],
    home: (d.links?.homepage || []).filter(Boolean)[0] || "",
    gh: (d.links?.repos_url?.github || []).filter(Boolean).slice(0, 3),
    dev: d.developer_data || null,
    votes: d.sentiment_votes_up_percentage ?? null,
    watch: d.watchlist_portfolio_users ?? null,
    spread: sp.length ? sp[Math.floor(sp.length / 2)] : null,
    ex: new Set(tk.map(t => t.market?.name).filter(Boolean)).size,
    x: d.links?.twitter_screen_name || ""
  };
}
function trimChart(r){
  const p = (r.prices || []).map(x => x[1]);
  const last = p.slice(-31); let vol = null;
  if(last.length > 10){
    const rets = []; for(let i = 1; i < last.length; i++) rets.push(Math.log(last[i] / last[i-1]));
    const m = rets.reduce((a, b) => a + b, 0) / rets.length;
    const sd = Math.sqrt(rets.reduce((a, b) => a + (b - m) ** 2, 0) / (rets.length - 1));
    vol = sd * Math.sqrt(365) * 100;
  }
  return { p, vol };
}
async function fetchDeriv(sym){
  try{
    const [p, oi, t] = await Promise.all([
      fetchJSON(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${sym}`),
      fetchJSON(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${sym}`),
      fetchJSON(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${sym}`)
    ]);
    let ls = null;
    try{ const q = await fetchJSON(`https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${sym}&period=1d&limit=1`); if(q && q[0]) ls = +q[0].longShortRatio; }catch(_){}
    return { src: "Binance Futures", funding: +p.lastFundingRate, oi: +oi.openInterest * +p.markPrice, ls, vol: +t.quoteVolume };
  }catch(e){
    const r = await fetchJSON(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${sym}`);
    const x = r?.result?.list?.[0];
    if(!x) throw new Error("contrat " + sym + " introuvable");
    let ls = null;
    try{ const q = await fetchJSON(`https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=${sym}&period=1d&limit=1`); const y = q?.result?.list?.[0]; if(y) ls = +y.buyRatio / +y.sellRatio; }catch(_){}
    return { src: "Bybit", funding: +x.fundingRate, oi: +x.openInterestValue, ls, vol: +x.turnover24h };
  }
}

/* Contexte de données d'une crypto */
function ctx(id){
  const coin = S.coins.find(c => c.id === id);
  const mk = C[kMk()]?.d || [];
  const chains = C.chains?.d || [];
  const chain = chains.find(c => c.gecko_id === id) || null;
  return {
    coin, m: mk.find(x => x.id === id) || null, btc: mk.find(x => x.id === "bitcoin") || null,
    d: C["dt:" + id]?.d || null, ch: C[`ch:${S.cur}:${id}`]?.d || null,
    chain, fees: chain ? (C["fees:" + chain.name]?.d || null) : null,
    dv: coin ? (C["dv:" + derivSym(coin)]?.d || null) : null,
    g: C.gl?.d || null, f: C.fng?.d || null
  };
}

/* ================= Checklist ================= */
const V = (v, src) => ({ v, src });
const SECTIONS = [
  { n: 1, t: "Tokenomics", items: [
    { k: "mcap", l: "Market cap", a: c => c.m && V(money(c.m.market_cap, true), "CoinGecko") },
    { k: "circ", l: "Offre en circulation", a: c => c.m && V(num(c.m.circulating_supply), "CoinGecko") },
    { k: "max", l: "Offre maximale", a: c => c.m && V(c.m.max_supply ? num(c.m.max_supply) : "Non plafonnée ou non publiée", "CoinGecko") },

const chk = id => (S.checks[id] = S.checks[id] || {});
const syn = id => (S.synth[id] = S.synth[id] || {});
function secStat(id, sec){
  const ch = chk(id); const rs = sec.items.map(i => ch[i.k]?.r).filter(r => r === 1 || r === 0 || r === -1);
  const avg = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
  return { done: rs.length, total: sec.items.length, avg };
}
function segColor(avg){ return avg === null ? "var(--empty)" : avg > .33 ? "var(--good)" : avg < -.33 ? "var(--bad)" : "var(--mid)"; }
function segs(id, big){
  const out = SECTIONS.map(s => {
    const st = secStat(id, s); const w = st.done / st.total * 100;
    return `<span class="seg" title="${s.n}. ${esc(s.t)} : ${st.done}/${st.total} évalués"><i style="width:${w}%;background:${segColor(st.avg)}"></i>${big ? `<b>${s.n}</b>` : ""}</span>`;
  });
  const sy = syn(id); const f = SYNTH.filter(([k]) => (sy[k] || "").trim()).length;
  out.push(`<span class="seg" title="12. Synthèse : ${f}/${SYNTH.length} rubriques remplies"><i style="width:${f / SYNTH.length * 100}%;background:var(--indigo)"></i>${big ? "<b>12</b>" : ""}</span>`);
  return `<div class="segs${big ? " big" : ""}" aria-label="Avancement de la checklist">${out.join("")}</div>`;
}
function missing(id){
  const c = ctx(id), ch = chk(id), out = [];
  SECTIONS.forEach(s => s.items.forEach(i => {
    const r = ch[i.k]?.r; const auto = i.a ? i.a(c) : null;
    if(!(r === 1 || r === 0 || r === -1) && !auto) out.push(`${s.n}. ${i.l}`);
  }));
  return out;
}

/* ================= Alertes ================= */
function alerts(id){
  const c = ctx(id), th = S.th, out = [];
  const add = (t, d, lvl = "warn") => out.push({ t, d, lvl });
  if(c.m){
    if(isNum(c.m.ath_change_percentage) && c.m.ath_change_percentage <= -th.drawdown)
      add("Prix très loin de son plus haut historique", `Baisse de ${pct(c.m.ath_change_percentage)} depuis l'ATH. Cela peut refléter une perte d'intérêt durable autant qu'une décote : vérifie la cause.`);
    if(c.m.fully_diluted_valuation && c.m.market_cap && c.m.fully_diluted_valuation / c.m.market_cap > th.fdvRatio)
      add("Risque de dilution", `La FDV vaut ${nf({maximumFractionDigits:2}).format(c.m.fully_diluted_valuation / c.m.market_cap)} fois la market cap : beaucoup de tokens restent à émettre. Contrôle le calendrier des unlocks.`);
    if(c.m.max_supply && c.m.circulating_supply / c.m.max_supply * 100 < th.supplyPct)
      add("Moins de la moitié de l'offre en circulation", `${nf({maximumFractionDigits:1}).format(c.m.circulating_supply / c.m.max_supply * 100)} % de l'offre maximale circule. Les émissions futures pèsent sur le prix si la demande ne suit pas.`);
    if(c.m.market_cap && c.m.total_volume / c.m.market_cap * 100 < th.volMc)
      add("Liquidité faible", `Le volume quotidien représente ${nf({maximumFractionDigits:2}).format(c.m.total_volume / c.m.market_cap * 100)} % de la market cap. Un ordre important peut déplacer le prix.`);
    const p7 = c.m.price_change_percentage_7d_in_currency;
    if(isNum(p7) && Math.abs(p7) > th.move7d)
      add("Mouvement fort sur 7 jours", `${pct(p7)} en une semaine. Identifie l'événement déclencheur avant toute décision ; les mouvements brusques se retournent souvent.`);
  }
  if(c.d && isNum(c.d.spread) && c.d.spread > th.spread)
    add("Spread élevé", `Écart achat/vente médian de ${nf({maximumFractionDigits:3}).format(c.d.spread)} %. Chaque aller-retour coûte au moins cet écart, hors frais.`);
  if(c.ch && isNum(c.ch.vol) && c.ch.vol > th.volat)
    add("Volatilité très élevée", `${nf({maximumFractionDigits:0}).format(c.ch.vol)} % annualisés sur 30 jours. Dimensionne ta position en conséquence.`);
  if(c.dv && isNum(c.dv.funding) && Math.abs(c.dv.funding * 100) > th.funding)
    add("Funding rate extrême", `${nf({maximumFractionDigits:4}).format(c.dv.funding * 100)} % par période (${c.dv.src}). Le marché à terme est déséquilibré ${c.dv.funding > 0 ? "à l'achat" : "à la vente"} ; ce déséquilibre précède souvent des liquidations en cascade.`);
  if(c.dv && isNum(c.dv.ls) && (c.dv.ls > th.lsRatio || c.dv.ls < 1 / th.lsRatio))
    add("Positionnement déséquilibré", `Ratio long/short de ${nf({maximumFractionDigits:2}).format(c.dv.ls)} (${c.dv.src}).`);
  if(c.f && (+c.f.value <= 20 || +c.f.value >= 80))
    add("Sentiment de marché extrême", `Indice Fear & Greed à ${c.f.value}/100 (${c.f.value_classification}). Il s'agit du marché crypto global, pas de cette crypto.`, "info");
  const ch = chk(id);
  if(!ch.unlock || ch.unlock.r == null) add("Calendrier des unlocks non évalué", "Critère à fort impact sur le prix. Consulte Tokenomist ou la documentation du projet.", "info");
  return out;
}

function spark(p){
  if(!p || p.length < 2) return `<p class="muted">Historique de prix indisponible.</p>`;
  const W = 300, H = 100, mn = Math.min(...p), mx = Math.max(...p), r = mx - mn || 1;
  const pts = p.map((v, i) => `${(i / (p.length - 1) * W).toFixed(1)},${(H - 6 - (v - mn) / r * (H - 12)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Prix sur 90 jours, de ${money(p[0])} à ${money(p[p.length-1])}">
    <polygon points="0,${H} ${pts.join(" ")} ${W},${H}" fill="var(--indigo-soft)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--indigo)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="muted" style="display:flex;justify-content:space-between"><span>il y a 90 j : ${money(p[0])}</span><span>min ${money(mn)}, max ${money(mx)}</span></div>`;
}

async function refresh(force){
  if(UI.loading) return; UI.loading = true; render();
  try{
    await Promise.all([getGlobal(force), getFng(force), getChains(false)]);
    await getMarkets(force); render();
    const order = UI.coin ? [UI.coin, ...ids().filter(i => i !== UI.coin)] : ids();
    for(const id of order){
      const co = S.coins.find(c => c.id === id); if(!co) continue;
      await Promise.all([getDeriv(co, force), (async () => { const ch = ctx(id).chain; if(ch) await getFees(ch.name, false); })()]);
      await getDetail(id, false); await getChart(id, false);
      const m = ctx(id).m; if(m && !co.image){ co.image = m.image; save(); }
      render();
    }
  }finally{ UI.loading = false; render(); }
}
async function addCoin(id, meta){
  if(ids().includes(id)){ toast("Déjà suivie"); return; }
  if(S.coins.length >= MAX_COINS){ toast("Limite de 5 cryptos atteinte"); return; }
  S.coins.push({ id, name: meta?.name || id, symbol: meta?.symbol || id, image: meta?.large || meta?.thumb || "" });
  save(); UI.results = null; render(); toast((meta?.name || id) + " ajoutée");
  await refresh(false);
  const m = ctx(id).m;
  if(m){ const co = S.coins.find(c => c.id === id); co.name = m.name; co.symbol = m.symbol; co.image = m.image; save(); render(); }
}
async function search(){
  const q = ($("#q")?.value || "").trim(); if(!q) return;

}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act === "view"){ UI.view = b.dataset.v; UI.coin = null; window.scrollTo(0, 0); render(); }
  else if(act === "open"){ UI.coin = b.dataset.id; UI.tab = "data"; window.scrollTo(0, 0); history.pushState({ coin: UI.coin }, ""); render(); refresh(false); }
  else if(act === "back"){ history.back(); }
  else if(act === "tab"){ UI.tab = b.dataset.v; render(); }
  else if(act === "refresh"){ refresh(true); }
  else if(act === "search"){ search(); }
  else if(act === "clearres"){ UI.results = null; render(); }
  else if(act === "add"){ const r = (UI.results || []).find(x => x.id === b.dataset.id); addCoin(b.dataset.id, r); }
  else if(act === "quick"){ const s = SUGGEST.find(x => x[0] === b.dataset.id); addCoin(b.dataset.id, { name: s[1].split(" (")[0], symbol: s[1].match(/\((\w+)\)/)[1].toLowerCase() }); }
  else if(act === "rate"){
    const id = UI.coin, k = b.dataset.k, r = +b.dataset.r, ch = chk(id);
    ch[k] = ch[k] || {}; ch[k].r = ch[k].r === r ? null : r; save();
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(ch[k].r) === x.dataset.r ? "true" : "false"));
    const sec = SECTIONS.find(s => s.items.some(i => i.k === k)); const st = secStat(id, sec);
    const cnt = document.getElementById("cnt" + sec.n); if(cnt) cnt.textContent = `${st.done}/${st.total}`;
    const big = document.querySelector(".segs.big"); if(big) big.outerHTML = segs(id, true);
  }
  else if(act === "setderiv"){ const co = ctx(UI.coin).coin; co.deriv = ($("#dsym").value || "").trim().toUpperCase(); save(); toast("Contrat enregistré"); refresh(false); }
  else if(act === "savepos"){ const co = ctx(UI.coin).coin; const q = parseFloat($("#qty").value), a = parseFloat($("#avg").value); co.qty = isNum(q) ? q : null; co.avg = isNum(a) ? a : null; save(); document.activeElement?.blur(); render(); toast("Position enregistrée"); }
  else if(act === "addj"){
    const r = $("#jr").value.trim(); if(!r){ toast("Indique la raison de la décision"); $("#jr").focus(); return; }
    const id = UI.coin; (S.journal[id] = S.journal[id] || []).push({ d: today(), a: $("#ja").value, p: parseFloat($("#jp").value), q: parseFloat($("#jq").value), r });
    save(); document.activeElement?.blur(); render(); toast("Ajouté au journal");
  }
  else if(act === "delj"){ if(confirm("Supprimer cette entrée du journal ?")){ S.journal[UI.coin].splice(+b.dataset.i, 1); save(); render(); } }
  else if(act === "remove"){
    const co = ctx(UI.coin).coin;
    if(confirm(`Retirer ${co.name} ? Ses évaluations et son journal seront supprimés de cet appareil.`)){
      S.coins = S.coins.filter(c => c.id !== co.id); delete S.checks[co.id]; delete S.synth[co.id]; delete S.journal[co.id];
      save(); UI.coin = null; render(); toast(co.name + " retirée");
    }
  }
  else if(act === "copy"){ copy(b.dataset.w === "news" ? newsPrompt() : claudePrompt(UI.coin)); }
  else if(act === "savekey"){ S.cgKey = $("#cgkey").value.trim(); save(); toast("Clé enregistrée"); }
  else if(act === "saveth"){ document.querySelectorAll("[data-th]").forEach(i => { const v = parseFloat(i.value); if(isNum(v)) S.th[i.dataset.th] = v; }); save(); toast("Seuils enregistrés"); }
  else if(act === "resetth"){ S.th = Object.assign({}, DEFAULT_TH); save(); render(); toast("Seuils réinitialisés"); }
  else if(act === "export"){
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `cyrcoin-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  else if(act === "clearcache"){ C = {}; saveCache(); toast("Cache vidé"); refresh(true); }
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "q"){ e.preventDefault(); search(); } });
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.note){ const ch = chk(UI.coin); ch[t.dataset.note] = ch[t.dataset.note] || {}; ch[t.dataset.note].n = t.value.trim(); save(); }
  else if(t.dataset.syn){ syn(UI.coin)[t.dataset.syn] = t.value; save(); }
  else if(t.id === "cur"){ S.cur = t.value; save(); refresh(false); }
  else if(t.id === "imp" && t.files[0]){
    t.files[0].text().then(txt => {
      const d = JSON.parse(txt); if(!Array.isArray(d.coins)) throw new Error("format");
      if(!confirm("Remplacer toutes les données actuelles par cette sauvegarde ?")) return;
      S = Object.assign({ coins: [], checks: {}, synth: {}, journal: {}, th: {}, cur: "eur", cgKey: "" }, d);
      S.coins = S.coins.slice(0, MAX_COINS); S.th = Object.assign({}, DEFAULT_TH, S.th);
      save(); render(); toast("Sauvegarde importée"); refresh(false);
    }).catch(() => toast("Fichier non reconnu : choisis une sauvegarde CyrCoin"));
  }
});
document.addEventListener("toggle", e => {
  const d = e.target; if(!d.dataset || !d.dataset.sec) return;
  const n = +d.dataset.sec; d.open ? UI.open.add(n) : UI.open.delete(n);
}, true);
window.addEventListener("popstate", () => { if(UI.coin){ UI.coin = null; render(); } });

/* ================= Démarrage ================= */
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
render();
refresh(false);
setInterval(() => { if(!document.hidden) refresh(false); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(false); });
</script>
</body>
</html>
